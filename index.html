<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #1e1e1e; color: #d4d4d4; height: 100vh; display: flex; overflow: hidden; }

        /* Left Sidebar */
        .sidebar { width: 220px; background-color: #252526; border-right: 1px solid #333; display: flex; flex-direction: column; justify-content: space-between; padding: 15px 10px; }
        .sidebar-top { display: flex; align-items: center; gap: 8px; font-weight: bold; color: #fff; padding: 8px; font-size: 14px; }
        .sidebar-bottom { display: flex; flex-direction: column; gap: 15px; font-size: 13px; color: #aaa; padding-left: 8px; }
        .sidebar-item { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .sidebar-item:hover { color: #fff; }

        /* Main Wrapper */
        .main-wrapper { flex: 1; padding: 25px 40px; display: flex; justify-content: center; align-items: flex-start; overflow-y: auto; background-color: #1e1e1e; }
        
        /* Center Card Frame */
        .panel-card { width: 100%; max-width: 1000px; background-color: #2b2b2b; border-radius: 12px; border: 1px solid #3c3c3c; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; flex-direction: column; }

        /* Card Header */
        .card-header { display: flex; justify-content: space-between; align-items: center; padding: 18px 25px 5px 25px; }
        .server-name-box { display: flex; align-items: center; gap: 10px; }
        .status-dot { width: 14px; height: 14px; background-color: #d4e157; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .status-dot i { font-size: 8px; color: #000; margin-left: 1px; }
        .server-title { font-size: 24px; font-weight: 800; color: #ffffff; cursor: pointer; border: none; background: transparent; outline: none; }
        
        .header-actions { display: flex; align-items: center; gap: 15px; color: #ffab00; }
        .action-btn { background: none; border: none; color: #ffab00; font-size: 16px; cursor: pointer; }
        .action-btn.power { color: #ff5252; }

        /* Navigation Tabs */
        .nav-tabs { display: flex; justify-content: space-around; border-bottom: 2px solid #ffff00; margin-top: 10px; padding: 0 10px; }
        .tab-item { display: flex; flex-direction: column; align-items: center; padding: 10px 15px; color: #aaa; font-size: 11px; cursor: pointer; transition: 0.2s; }
        .tab-item i { font-size: 16px; margin-bottom: 4px; }
        .tab-item:hover { color: #fff; }
        .tab-item.active { color: #fff; font-weight: bold; }

        /* Content Body */
        .content-body { padding: 0; background-color: #000; flex: 1; display: flex; flex-direction: column; }
        .tab-page { display: none; }
        .tab-page.active { display: flex; flex-direction: column; flex: 1; }

        #console { height: 420px; padding: 15px; overflow-y: auto; font-family: 'Consolas', 'Courier New', monospace; font-size: 13px; color: #ffffff; line-height: 1.4; white-space: pre-wrap; word-break: break-all; }

        /* Bottom Command Input */
        .command-bar { display: flex; align-items: center; background-color: #2b2b2b; padding: 12px 20px; gap: 10px; }
        .command-input-wrapper { flex: 1; background-color: #222; border: 1px solid #444; border-radius: 20px; padding: 6px 15px; display: flex; align-items: center; }
        .command-input { width: 100%; background: transparent; border: none; outline: none; color: #fff; font-size: 13px; }
        .send-btn { background: none; border: none; color: #fff; font-size: 18px; cursor: pointer; }
        .send-btn:hover { color: #ffff00; }

        /* Custom File Manager Styles */
        .tab-padded { padding: 25px; background-color: #222; color: #fff; min-height: 400px; }
        .btn-upload { background-color: #ffab00; color: #000; border: none; padding: 8px 16px; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .file-section { margin-bottom: 25px; border-bottom: 1px solid #333; padding-bottom: 20px; }
        .file-input-text { width: 100%; padding: 8px; background-color: #1a1a1a; border: 1px solid #444; color: #fff; border-radius: 4px; margin-top: 8px; font-size: 13px; outline: none; }
        .file-textarea { width: 100%; height: 80px; padding: 8px; background-color: #1a1a1a; border: 1px solid #444; color: #fff; border-radius: 4px; margin-top: 8px; font-family: monospace; font-size: 12px; outline: none; resize: vertical; }

        /* File Grid Layout */
        .file-grid { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 15px; }
        .file-card { width: 95px; height: 105px; background-color: #2d2d2d; border: 1px solid #3c3c3c; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px; cursor: pointer; transition: background 0.2s; }
        .file-card:hover { background-color: #383838; border-color: #ffab00; }
        .file-icon { font-size: 42px; color: #cccccc; margin-bottom: 8px; }
        .file-name { font-size: 11px; color: #d4d4d4; text-align: center; word-break: break-all; max-width: 100%; line-height: 1.2; text-overflow: ellipsis; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    </style>
</head>
<body>

    <!-- Left Sidebar -->
    <div class="sidebar">
        <div class="sidebar-top">
            <i class="fa-solid fa-server"></i> 서버
        </div>
        <div class="sidebar-bottom">
            <div class="sidebar-item"><i class="fa-solid fa-chevron-left"></i> 접기</div>
            <div class="sidebar-item"><i class="fa-solid fa-right-from-bracket"></i> 로그아웃</div>
        </div>
    </div>

    <!-- Main Container -->
    <div class="main-wrapper">
        <div class="panel-card">
            
            <!-- Header -->
            <div class="card-header">
                <div class="server-name-box">
                    <div class="status-dot"><i class="fa-solid fa-play"></i></div>
                    <input type="text" id="serverTitle" class="server-title" value="noobis" title="클릭하여 서버 이름 변경">
                </div>
                <div class="header-actions">
                    <button class="action-btn" title="재시작"><i class="fa-solid fa-rotate-right"></i></button>
                    <button class="action-btn power" title="전원"><i class="fa-solid fa-square"></i></button>
                    <button class="action-btn" title="더보기"><i class="fa-solid fa-ellipsis-vertical"></i></button>
                </div>
            </div>

            <!-- Navigation Bar -->
            <div class="nav-tabs">
                <div class="tab-item" onclick="showTab('console', this)"><i class="fa-solid fa-terminal"></i>콘솔</div>
                <div class="tab-item" onclick="showTab('stats', this)"><i class="fa-solid fa-chart-line"></i>통계</div>
                <div class="tab-item active" onclick="showTab('files', this)"><i class="fa-solid fa-file"></i>파일</div>
                <div class="tab-item" onclick="showTab('settings', this)"><i class="fa-solid fa-gear"></i>설정</div>
                <div class="tab-item" onclick="showTab('users', this)"><i class="fa-solid fa-users"></i>사용자</div>
                <div class="tab-item" onclick="showTab('sftp', this)"><i class="fa-solid fa-network-wired"></i>SFTP 정보</div>
                <div class="tab-item" onclick="showTab('backup', this)"><i class="fa-solid fa-rotate-left"></i>Backup</div>
            </div>

            <!-- Main Content Area -->
            <div class="content-body">
                
                <!-- 1. 콘솔 탭 -->
                <div id="page-console" class="tab-page">
                    <div id="console"></div>
                    <div class="command-bar">
                        <div class="command-input-wrapper">
                            <input type="text" id="cmdInput" class="command-input" placeholder="Command" onkeypress="handleKeyPress(event)">
                        </div>
                        <button class="send-btn" onclick="sendCommand()"><i class="fa-solid fa-paper-plane"></i></button>
                    </div>
                </div>

                <!-- 2. 파일 탭 -->
                <div id="page-files" class="tab-page active">
                    <div class="tab-padded">
                        
                        <!-- 서버 파일 목록 영역 (아이콘 그리드) -->
                        <div class="file-section">
                            <h3>📂 서버 탐색기</h3>
                            <div class="file-grid" id="fileGrid">
                                <!-- 기본 예시 폴더 및 파일들 -->
                                <div class="file-card"><i class="fa-solid fa-folder file-icon"></i><span class="file-name">plugins</span></div>
                                <div class="file-card"><i class="fa-solid fa-folder file-icon"></i><span class="file-name">world</span></div>
                                <div class="file-card"><i class="fa-solid fa-brands fa-java file-icon"></i><span class="file-name">paper.jar</span></div>
                                <div class="file-card"><i class="fa-solid fa-file-gear file-icon"></i><span class="file-name">server.properties</span></div>
                                <div class="file-card"><i class="fa-solid fa-file-gear file-icon"></i><span class="file-name">ops.json</span></div>
                                <div class="file-card"><i class="fa-solid fa-file-lines file-icon"></i><span class="file-name">eula.txt</span></div>
                            </div>
                        </div>

                        <!-- 파일 업로드 섹션 -->
                        <div class="file-section">
                            <h3>📤 서버 파일 업로드</h3>
                            <input type="file" id="fileInput" style="margin-top:10px;">
                            <br>
                            <button class="btn-upload" onclick="uploadFile()">업로드 전송</button>
                            <p id="uploadStatus" style="margin-top: 5px; color: #ffab00; font-size: 12px;"></p>
                        </div>

                        <!-- 파일 직접 생성 섹션 -->
                        <div class="file-section" style="border-bottom: none;">
                            <h3>📝 새 파일 만들기</h3>
                            <input type="text" id="newFileName" class="file-input-text" placeholder="파일명 입력 (예: config.yml, ops.json)">
                            <textarea id="newFileContent" class="file-textarea" placeholder="파일 내용 입력..."></textarea>
                            <button class="btn-upload" style="background-color: #388e3c; color: #fff;" onclick="createFile()">파일 생성 및 저장</button>
                            <p id="createStatus" style="margin-top: 5px; color: #81c784; font-size: 12px;"></p>
                        </div>
                    </div>
                </div>

                <!-- 기타 탭들 -->
                <div id="page-settings" class="tab-page"><div class="tab-padded"><h3>⚙️ 서버 설정</h3></div></div>
                <div id="page-users" class="tab-page"><div class="tab-padded"><h3>👥 사용자 관리</h3></div></div>
                <div id="page-stats" class="tab-page"><div class="tab-padded"><h3>📊 실시간 통계</h3></div></div>
                <div id="page-sftp" class="tab-page"><div class="tab-padded"><h3>🔌 SFTP 접속 정보</h3></div></div>
                <div id="page-backup" class="tab-page"><div class="tab-padded"><h3>🔄 백업</h3></div></div>

            </div>
        </div>
    </div>

    <script>
        const BACKEND_URL = "https://mc-hosting-6fri.onrender.com";
        const WS_URL = "wss://mc-hosting-6fri.onrender.com";

        function showTab(tabName, el) {
            document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-page').forEach(p => p.classList.remove('active'));
            
            el.classList.add('active');
            document.getElementById(`page-${tabName}`).classList.add('active');
        }

        const consoleElem = document.getElementById('console');
        const ws = new WebSocket(WS_URL);

        ws.onopen = () => { appendLog("[SYSTEM] 백엔드 콘솔 스트림에 연결되었습니다.\n"); };
        ws.onmessage = (event) => { appendLog(event.data); };

        function appendLog(text) {
            consoleElem.textContent += text;
            consoleElem.scrollTop = consoleElem.scrollHeight;
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendCommand();
        }

        function sendCommand() {
            const input = document.getElementById('cmdInput');
            if (input.value.trim() !== "") {
                ws.send(input.value);
                input.value = "";
            }
        }

        // 확장자에 따른 아이콘 클래스 판별 함수
        function getIconClass(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            
            if (!filename.includes('.')) {
                return 'fa-solid fa-folder'; // 폴더 (이미지 1)
            } else if (ext === 'jar') {
                return 'fa-solid fa-brands fa-java'; // 자바 (이미지 4)
            } else if (['json', 'yml', 'yaml', 'properties'].includes(ext)) {
                return 'fa-solid fa-file-gear'; // 설정 문서 (이미지 3)
            } else {
                return 'fa-solid fa-file-lines'; // 일반 문서 (이미지 2)
            }
        }

        // 화면 그리드에 파일 카드 추가
        function addFileToGrid(filename) {
            const grid = document.getElementById('fileGrid');
            const iconClass = getIconClass(filename);

            const card = document.createElement('div');
            card.className = 'file-card';
            card.innerHTML = `<i class="${iconClass} file-icon"></i><span class="file-name">${filename}</span>`;
            
            grid.appendChild(card);
        }

        // 1. File Upload
        async function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            const status = document.getElementById('uploadStatus');
            if (fileInput.files.length === 0) return alert("파일을 선택하세요.");

            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append('mcFile', file);

            status.textContent = "업로드 중...";
            try {
                const res = await fetch(`${BACKEND_URL}/upload`, { method: 'POST', body: formData });
                const data = await res.json();
                status.textContent = data.message;
                addFileToGrid(file.name);
            } catch (err) {
                status.textContent = "업로드 실패: " + err.message;
            }
        }

        // 2. Create File directly from text
        async function createFile() {
            const fileName = document.getElementById('newFileName').value.trim();
            const content = document.getElementById('newFileContent').value;
            const status = document.getElementById('createStatus');

            if (!fileName) return alert("생성할 파일 이름을 입력해주세요.");

            const blob = new Blob([content], { type: 'text/plain' });
            const file = new File([blob], fileName);

            const formData = new FormData();
            formData.append('mcFile', file);

            status.textContent = "파일 생성 및 전송 중...";
            try {
                const res = await fetch(`${BACKEND_URL}/upload`, { method: 'POST', body: formData });
                const data = await res.json();
                status.textContent = `'${fileName}' 파일이 정상적으로 생성되었습니다!`;
                
                addFileToGrid(fileName);

                document.getElementById('newFileName').value = '';
                document.getElementById('newFileContent').value = '';
            } catch (err) {
                status.textContent = "생성 실패: " + err.message;
            }
        }
    </script>
</body>
</html>
