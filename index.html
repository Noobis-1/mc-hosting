<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Minecraft Server Management</title>
    <style>
        body { font-family: sans-serif; background: #1e1e1e; color: #fff; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        #console { width: 100%; height: 300px; background: #000; color: #0f0; border: 1px solid #444; padding: 10px; box-sizing: border-box; overflow-y: scroll; font-family: monospace; }
        .input-group { display: flex; margin-top: 10px; }
        .input-group input { flex: 1; padding: 10px; background: #2d2d2d; border: 1px solid #444; color: #fff; }
        .input-group button { padding: 10px 20px; background: #28a745; border: none; color: #fff; cursor: pointer; }
        .section { margin-top: 30px; background: #2d2d2d; padding: 15px; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 마인크래프트 서버 관리판</h1>
        
        <div class="section">
            <h2>웹 콘솔</h2>
            <pre id="console"></pre>
            <div class="input-group">
                <input type="text" id="cmdInput" placeholder="명령어 입력... (예: say Hello)">
                <button onclick="sendCommand()">전송</button>
            </div>
        </div>

        <div class="section">
            <h2>파일 업로드 (서버 JAR / 플러그인 등)</h2>
            <input type="file" id="fileInput">
            <button onclick="uploadFile()">업로드</button>
            <p id="uploadStatus"></p>
        </div>
    </div>

    <script>
        const BACKEND_URL = "https://mc-hosting-6fri.onrender.com";
        const WS_URL = "wss://mc-hosting-6fri.onrender.com";

        const consoleElem = document.getElementById('console');
        const ws = new WebSocket(WS_URL);

        ws.onmessage = (event) => {
            consoleElem.textContent += event.data;
            consoleElem.scrollTop = consoleElem.scrollHeight;
        };

        function sendCommand() {
            const input = document.getElementById('cmdInput');
            if (input.value.trim() !== "") {
                ws.send(input.value);
                input.value = "";
            }
        }

        async function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            const status = document.getElementById('uploadStatus');
            if (fileInput.files.length === 0) return alert("파일을 선택하세요.");

            const formData = new FormData();
            formData.append('mcFile', fileInput.files[0]);

            status.textContent = "업로드 중...";
            try {
                const res = await fetch(`${BACKEND_URL}/upload`, {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                status.textContent = data.message;
            } catch (err) {
                status.textContent = "업로드 실패: " + err.message;
            }
        }
    </script>
</body>
</html>
