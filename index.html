<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #1e1e1e; color: #d4d4d4; height: 100vh; display: flex; overflow: hidden; }

        /* Left Sidebar */
        .sidebar { width: 220px; background-color: #252526; border-right: 1px solid #333; display: flex; flex-direction: column; justify-content: space-between; padding: 15px 10px; }
        .sidebar-top { display: flex; align-items: center; gap: 8px; font-weight: bold; color: #fff; padding: 8px; font-size: 14px; }
        .sidebar-bottom { display: flex; flex-direction: column; gap: 15px; font-size: 13px; color: #aaa; padding-left: 8px; }
        .sidebar-item { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .sidebar-item:hover { color: #fff; }

        /* Main Wrapper */
        .main-wrapper { flex: 1; padding: 25px 40px; display: flex; justify-content: center; align-items: flex-start; overflow-y: auto; background-color: #1e1e1e; }
        
        /* Center Card Frame */
        .panel-card { width: 100%; max-width: 1000px; background-color: #2b2b2b; border-radius: 12px; border: 1px solid #3c3c3c; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; flex-direction: column; }

        /* Card Header */
        .card-header { display: flex; justify-content: space-between; align-items: center; padding: 18px 25px 5px 25px; }
        .server-name-box { display: flex; align-items: center; gap: 10px; }
        .status-dot { width: 14px; height: 14px; background-color: #d4e157; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .status-dot i { font-size: 8px; color: #000; margin-left: 1px; }
        .server-title { font-size: 24px; font-weight: 800; color: #ffffff; cursor: pointer; border: none; background: transparent; outline: none; }
        .server-title:hover { border-bottom: 1px dashed #ffff00; }
        
        .header-actions { display: flex; align-items: center; gap: 15px; color: #ffab00; }
        .action-btn { background: none; border: none; color: #ffab00; font-size: 16px; cursor: pointer; }
        .action-btn.power { color: #ff5252; }

        /* Navigation Tabs */
        .nav-tabs { display: flex; justify-content: space-around; border-bottom: 2px solid #ffff00; margin-top: 10px; padding: 0 10px; }
        .tab-item { display: flex; flex-direction: column; align-items: center; padding: 10px 15px; color: #aaa; font-size: 11px; cursor: pointer; transition: 0.2s; }
        .tab-item i { font-size: 16px; margin-bottom: 4px; }
        .tab-item:hover { color: #fff; }
        .tab-item.active { color: #fff; font-weight: bold; }

        /* Console Output Container */
        .content-body { padding: 0; background-color: #000; flex: 1; display: flex; flex-direction: column; }
        .tab-page { display: none; }
        .tab-page.active { display: flex; flex-direction: column; flex: 1; }

        #console { height: 420px; padding: 15px; overflow-y: auto; font-family: 'Consolas', 'Courier New', monospace; font-size: 13px; color: #ffffff; line-height: 1.4; white-space: pre-wrap; word-break: break-all; }

        /* Bottom Command Input */
        .command-bar { display: flex; align-items: center; background-color: #2b2b2b; padding: 12px 20px; gap: 10px; }
        .command-input-wrapper { flex: 1; background-color: #222; border: 1px solid #444; border-radius: 20px; padding: 6px 15px; display: flex; align-items: center; }
        .command-input { width: 100%; background: transparent; border: none; outline: none; color: #fff; font-size: 13px; }
        .send-btn { background: none; border: none; color: #fff; font-size: 18px; cursor: pointer; }
        .send-btn:hover { color: #ffff00; }

        /* Other Tabs Layout */
        .tab-padded { padding: 25px; background-color: #222; color: #fff; min-height: 300px; }
        .btn-upload { background-color: #ffab00; color: #000; border: none; padding: 8px 16px; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

    <!-- Left Sidebar -->
    <div class="sidebar">
        <div class="sidebar-top">
            <i class="fa-solid fa-server"></i> 서버
        </div>
        <div class="sidebar-bottom">
            <div class="sidebar-item"><i class="fa-solid fa-chevron-left"></i> 접기</div>
            <div class="sidebar-item"><i class="fa-solid fa-right-from-bracket"></i> 로그아웃</div>
        </div>
    </div>

    <!-- Main Container -->
    <div class="main-wrapper">
        <div class="panel-card">
            
            <!-- Header -->
            <div class="card-header">
                <div class="server-name-box">
                    <div class="status-dot"><i class="fa-solid fa-play"></i></div>
                    <input type="text" id="serverTitle" class="server-title" value="noobis" title="클릭하여 서버 이름 변경">
                </div>
                <div class="header-actions">
                    <button class="action-btn" title="재시작"><i class="fa-solid fa-rotate-right"></i></button>
                    <button class="action-btn power" title="전원"><i class="fa-solid fa-square"></i></button>
                    <button class="action-btn" title="더보기"><i class="fa-solid fa-ellipsis-vertical"></i></button>
                </div>
            </div>

            <!-- Navigation Bar -->
            <div class="nav-tabs">
                <div class="tab-item active" onclick="showTab('console', this)"><i class="fa-solid fa-terminal"></i>콘솔</div>
                <div class="tab-item" onclick="showTab('stats', this)"><i class="fa-solid fa-chart-line"></i>통계</div>
                <div class="tab-item" onclick="showTab('files', this)"><i class="fa-solid fa-file"></i>파일</div>
                <div class="tab-item" onclick="showTab('settings', this)"><i class="fa-solid fa-gear"></i>설정</div>
                <div class="tab-item" onclick="showTab('users', this)"><i class="fa-solid fa-users"></i>사용자</div>
                <div class="tab-item" onclick="showTab('sftp', this)"><i class="fa-solid fa-network-wired"></i>SFTP 정보</div>
                <div class="tab-item" onclick="showTab('backup', this)"><i class="fa-solid fa-rotate-left"></i>Backup</div>
            </div>

            <!-- Main Content Area -->
            <div class="content-body">
                
                <!-- 1. 콘솔 탭 -->
                <div id="page-console" class="tab-page active">
                    <div id="console"></div>
                    <div class="command-bar">
                        <div class="command-input-wrapper">
                            <input type="text" id="cmdInput" class="command-input" placeholder="Command" onkeypress="handleKeyPress(event)">
                        </div>
                        <button class="send-btn" onclick="sendCommand()"><i class="fa-solid fa-paper-plane"></i></button>
                    </div>
                </div>

                <!-- 2. 파일 탭 -->
                <div id="page-files" class="tab-page">
                    <div class="tab-padded">
                        <h3>📁 서버 파일 업로드</h3>
                        <p style="margin-top:10px;">서버 JAR 파일 또는 플러그인, 맵 파일을 전송할 수 있습니다.</p>
                        <br>
                        <input type="file" id="fileInput">
                        <br>
                        <button class="btn-upload" onclick="uploadFile()">업로드 전송</button>
                        <p id="uploadStatus" style="margin-top: 10px; color: #ffab00;"></p>
                    </div>
                </div>

                <!-- 3. 설정 탭 -->
                <div id="page-settings" class="tab-page">
                    <div class="tab-padded">
                        <h3>⚙️ 서버 설정</h3>
                        <p style="margin-top:10px;">`server.properties` 항목을 웹에서 바로 수정할 수 있습니다.</p>
                    </div>
                </div>

                <!-- 4. 사용자 탭 -->
                <div id="page-users" class="tab-page">
                    <div class="tab-padded">
                        <h3>👥 사용자 및 권한 관리</h3>
                        <p style="margin-top:10px;">서버 접속자 및 OP 권한 관리 화면입니다.</p>
                    </div>
                </div>

                <!-- 기타 탭들 -->
                <div id="page-stats" class="tab-page"><div class="tab-padded"><h3>📊 실시간 통계</h3><p>CPU 및 메모리 사용량</p></div></div>
                <div id="page-sftp" class="tab-page"><div class="tab-padded"><h3>🔌 SFTP 접속 정보</h3><p>Host: mc-hosting-6fri.onrender.com</p></div></div>
                <div id="page-backup" class="tab-page"><div class="tab-padded"><h3>🔄 백업</h3><p>자동 백업 세팅</p></div></div>

            </div>
        </div>
    </div>

    <script>
        const BACKEND_URL = "https://mc-hosting-6fri.onrender.com";
        const WS_URL = "wss://mc-hosting-6fri.onrender.com";

        // Tab Switching Logic
        function showTab(tabName, el) {
            document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-page').forEach(p => p.classList.remove('active'));
            
            el.classList.add('active');
            document.getElementById(`page-${tabName}`).classList.add('active');
        }

        // WebSocket Console Connection
        const consoleElem = document.getElementById('console');
        const ws = new WebSocket(WS_URL);

        ws.onopen = () => {
            appendLog("[SYSTEM] 백엔드 콘솔 스트림에 연결되었습니다.\n");
        };

        ws.onmessage = (event) => {
            appendLog(event.data);
        };

        function appendLog(text) {
            consoleElem.textContent += text;
            consoleElem.scrollTop = consoleElem.scrollHeight;
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendCommand();
        }

        function sendCommand() {
            const input = document.getElementById('cmdInput');
            if (input.value.trim() !== "") {
                ws.send(input.value);
                input.value = "";
            }
        }

        async function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            const status = document.getElementById('uploadStatus');
            if (fileInput.files.length === 0) return alert("파일을 선택하세요.");

            const formData = new FormData();
            formData.append('mcFile', fileInput.files[0]);

            status.textContent = "업로드 중...";
            try {
                const res = await fetch(`${BACKEND_URL}/upload`, { method: 'POST', body: formData });
                const data = await res.json();
                status.textContent = data.message;
            } catch (err) {
                status.textContent = "업로드 실패: " + err.message;
            }
        }
    </script>
</body>
</html>
