<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft server</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: #f0f0f0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            font-size: 12px; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            padding: 8px;
        }

        /* Top Info Header */
        .server-info {
            background-color: #ffffff;
            border: 1px solid #a0a0a0;
            padding: 6px 10px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .server-title { font-weight: bold; color: #333; }
        
        /* Main Log Output Area (Minecraft Console Style) */
        .console-container {
            flex: 1;
            background-color: #ffffff;
            border: 1px solid #a0a0a0;
            padding: 6px;
            overflow-y: scroll;
            margin-bottom: 6px;
        }
        #output {
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.3;
            color: #000000;
            white-space: pre-wrap;
            word-break: break-all;
        }

        /* Bottom Command Input Bar */
        .input-container {
            display: flex;
            gap: 6px;
        }
        .cmd-input {
            flex: 1;
            padding: 4px 6px;
            border: 1px solid #a0a0a0;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 12px;
            outline: none;
        }
        .cmd-input:focus {
            border-color: #0078d7;
        }
        .btn-send {
            padding: 4px 16px;
            background-color: #e1e1e1;
            border: 1px solid #adadad;
            font-size: 12px;
            cursor: pointer;
        }
        .btn-send:hover {
            background-color: #e5f1fb;
            border-color: #0078d7;
        }

        /* Upload Modal (Minimalist) */
        .upload-bar {
            background: #e6e6e6;
            border: 1px solid #ccc;
            padding: 6px 10px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
    </style>
</head>
<body>

    <!-- Server Header -->
    <div class="server-info">
        <span class="server-title">Minecraft server - Render Host</span>
        <button class="btn-send" onclick="toggleUpload()">파일 업로드 창</button>
    </div>

    <!-- Hidden Upload Controls -->
    <div id="uploadZone" class="upload-bar" style="display: none;">
        <span>서버 파일 선택:</span>
        <input type="file" id="fileInput">
        <button class="btn-send" onclick="uploadFile()">업로드</button>
        <span id="uploadStatus" style="color: blue;"></span>
    </div>

    <!-- Main Output Window -->
    <div class="console-container" id="consoleBox">
        <div id="output"></div>
    </div>

    <!-- Command Line -->
    <div class="input-container">
        <input type="text" id="cmdInput" class="cmd-input" placeholder="" onkeydown="handleKeyDown(event)">
        <button class="btn-send" onclick="sendCommand()">전송</button>
    </div>

    <script>
        const BACKEND_URL = "https://mc-hosting-6fri.onrender.com";
        const WS_URL = "wss://mc-hosting-6fri.onrender.com";

        const outputElem = document.getElementById('output');
        const consoleBox = document.getElementById('consoleBox');
        const inputElem = document.getElementById('cmdInput');

        // Connect WebSocket
        const ws = new WebSocket(WS_URL);

        ws.onopen = () => {
            appendLog("[INFO] Starting minecraft server version 1.20.x\n[INFO] Loading properties...\n[INFO] Default game type: SURVIVAL\n[INFO] Generating keypair...\n[INFO] Starting Minecraft server on *:25565\n");
        };

        ws.onmessage = (event) => {
            appendLog(event.data);
        };

        function appendLog(text) {
            outputElem.textContent += text;
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }

        function handleKeyDown(e) {
            if (e.key === 'Enter') sendCommand();
        }

        function sendCommand() {
            const cmd = inputElem.value;
            if (cmd.trim() !== '') {
                ws.send(cmd);
                inputElem.value = '';
            }
        }

        function toggleUpload() {
            const zone = document.getElementById('uploadZone');
            zone.style.display = zone.style.display === 'none' ? 'flex' : 'none';
        }

        async function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            const status = document.getElementById('uploadStatus');
            if (fileInput.files.length === 0) return alert("파일을 선택하세요.");

            const formData = new FormData();
            formData.append('mcFile', fileInput.files[0]);

            status.textContent = "업로드 중...";
            try {
                const res = await fetch(`${BACKEND_URL}/upload`, { method: 'POST', body: formData });
                const data = await res.json();
                status.textContent = data.message;
            } catch (err) {
                status.textContent = "실패: " + err.message;
            }
        }
    </script>
</body>
</html>
